<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <title>Karten</title>
        <link
            rel="stylesheet"
            href="seite.css"
        />
        <!-- Verbindung zu ioBroker, wie sie der Admin selbst ausliefert -->
        <script src="../../lib/js/socket.io.js"></script>
        <script
            type="module"
            src="karten.js"
        ></script>
    </head>
    <body>
        <header class="kopf">
            <p
                class="hinweis"
                id="hinweis"
            ></p>
            <div class="knoepfe">
                <button
                    type="button"
                    class="knopf"
                    id="erkennen"
                    disabled
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"
                        />
                    </svg>
                    <span id="erkennenText"></span>
                    <span
                        class="zahl"
                        id="erkanntZahl"
                        hidden
                    ></span>
                </button>
                <button
                    type="button"
                    class="knopf haupt"
                    id="neu"
                    disabled
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    <span id="neuText"></span>
                </button>
            </div>
        </header>
        <p
            class="meldung"
            id="meldung"
            role="status"
        ></p>
        <main id="liste"></main>

        <dialog id="dialog">
            <form
                method="dialog"
                id="formular"
                novalidate
            >
                <h2 id="titel"></h2>
                <p
                    class="meldung"
                    id="fehler"
                    role="alert"
                ></p>
                <label class="feld">
                    <span id="nameLabel"></span>
                    <input
                        id="name"
                        autocomplete="off"
                        required
                    />
                </label>
                <div class="zeile">
                    <label class="feld">
                        <span id="typLabel"></span>
                        <select id="typ"></select>
                    </label>
                    <label class="feld">
                        <span id="raumLabel"></span>
                        <select id="raum"></select>
                    </label>
                </div>
                <fieldset class="teile">
                    <legend id="teileLabel"></legend>
                    <div id="teile"></div>
                </fieldset>
                <footer class="fuss">
                    <button
                        type="button"
                        class="knopf gefahr"
                        id="loeschen"
                    ></button>
                    <span class="platz"></span>
                    <button
                        type="button"
                        class="knopf"
                        id="abbrechen"
                    ></button>
                    <button
                        type="submit"
                        class="knopf haupt"
                        id="speichern"
                    ></button>
                </footer>
                <footer
                    class="fuss frage"
                    id="loeschfrage"
                    hidden
                >
                    <span id="loeschfrageText"></span>
                    <span class="platz"></span>
                    <button
                        type="button"
                        class="knopf"
                        id="nichtLoeschen"
                    ></button>
                    <button
                        type="button"
                        class="knopf gefahr voll"
                        id="wirklichLoeschen"
                    ></button>
                </footer>
            </form>
        </dialog>

        <dialog id="erkanntDialog">
            <form
                method="dialog"
                id="erkanntFormular"
            >
                <h2 id="erkanntTitel"></h2>
                <p
                    class="erklaerung"
                    id="erkanntErklaerung"
                ></p>
                <p
                    class="meldung"
                    id="erkanntFehler"
                    role="alert"
                ></p>
                <div
                    class="wahlliste erkannt"
                    id="erkanntListe"
                    aria-live="polite"
                ></div>
                <footer class="fuss">
                    <button
                        type="button"
                        class="knopf"
                        id="alleWaehlen"
                    ></button>
                    <span class="platz"></span>
                    <button
                        type="button"
                        class="knopf"
                        id="erkanntAbbrechen"
                    ></button>
                    <button
                        type="submit"
                        class="knopf haupt"
                        id="anlegen"
                        disabled
                    ></button>
                </footer>
            </form>
        </dialog>
    </body>
</html>
